# Compila el APK de la app Android.
# Se descarga desde la pestaña Actions → run → Artifacts (camstream-apk),
# y al crear un tag v* se publica en la Release junto a los receptores.
name: build-apk

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/build-apk.yml"]
    tags: ["v*"]
  pull_request:
    paths: ["android/**", ".github/workflows/build-apk.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: camstream-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish release (solo tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
