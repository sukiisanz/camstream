# Compila el receptor para Windows (exe), Linux (tar.gz + RPM con GUI).
# Se descargan desde la pestaña Actions → run → Artifacts,
# y al crear un tag v* se publican en una Release.
name: build-receiver

on:
  push:
    branches: [main]
    paths: ["receiver/**", "packaging/**", ".github/workflows/build-receiver.yml"]
    tags: ["v*"]
  pull_request:
    paths: ["receiver/**", "packaging/**", ".github/workflows/build-receiver.yml"]
  workflow_dispatch:

jobs:
  check-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install GTK bindings
        run: sudo apt-get update && sudo apt-get install -y python3-gi gir1.2-gtk-3.0 python3-tk

      - name: Syntax check
        run: python3 -m py_compile receiver/camstream_receiver.py receiver/camstream_gui.py receiver/camstream_gui_win.py

      - name: Import check (GUIs)
        working-directory: receiver
        run: |
          python3 -c "import camstream_gui"
          python3 -c "import camstream_gui_win"

  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: camstream-receiver-windows
            binary: dist/camstream-receiver.exe
          - os: ubuntu-latest
            artifact: camstream-receiver-linux
            binary: dist/camstream-receiver-linux.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: receiver
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller pillow -r requirements.txt

      - name: Make exe icon from the logo (Windows)
        if: runner.os == 'Windows'
        working-directory: receiver
        run: python -c "from PIL import Image; Image.open('../CamStream-logo.png').save('icon.ico', sizes=[(256,256),(128,128),(64,64),(48,48),(32,32),(16,16)])"

      - name: Build executable
        if: runner.os != 'Windows'
        working-directory: receiver
        run: python -m PyInstaller --onefile --console --name camstream-receiver camstream_receiver.py

      # En Windows la ventana ES el programa: un único exe, sin consola.
      - name: Build executable (Windows, GUI)
        if: runner.os == 'Windows'
        working-directory: receiver
        run: python -m PyInstaller --onefile --windowed --icon icon.ico --add-data "icon.ico;." --name camstream-receiver camstream_gui_win.py

      # El ZIP de los artifacts pierde el permiso de ejecución; un tar.gz
      # dentro del ZIP lo conserva (tar -xzf y listo).
      - name: Pack Linux binary (preserva permisos)
        if: runner.os == 'Linux'
        working-directory: receiver
        run: tar -czf dist/camstream-receiver-linux.tar.gz -C dist camstream-receiver

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: receiver/${{ matrix.binary }}

      - name: Publish release (solo tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: receiver/${{ matrix.binary }}

  rpm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install rpmbuild
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Build RPM
        run: |
          rpmbuild -bb packaging/camstream-receiver.spec \
            --define "_topdir $PWD/rpmbuild" \
            --define "srcdir $PWD"
          ls -l rpmbuild/RPMS/noarch/

      - uses: actions/upload-artifact@v4
        with:
          name: camstream-receiver-rpm
          path: rpmbuild/RPMS/noarch/*.rpm

      - name: Publish release (solo tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: rpmbuild/RPMS/noarch/*.rpm
